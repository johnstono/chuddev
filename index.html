<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChudDev Tools</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:#fff}header{background:#161b22;padding:20px;text-align:center}nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px}nav a{color:#fff;text-decoration:none;background:#238636;padding:10px 15px;border-radius:6px}.card{background:#161b22;padding:20px;border-radius:12px;margin:20px}textarea,input{width:100%;padding:10px;background:#222;color:#fff;border:1px solid #333}button{padding:10px;margin-top:10px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer}iframe{width:100%;height:250px;border:none;background:#fff;margin-top:10px}</style></head><body><header><h1>🚀 ChudDev Tools</h1><p>Learn • Build • Experiment</p></header><nav><a href="#learn">Learn</a><a href="#html">HTML</a><a href="#css">CSS</a><a href="#js">JS</a><a href="#tools">Tools</a></nav><div id="learn" class="card"><h2>Learn Coding</h2><p>HTML, CSS, JavaScript, Python and GitHub basics.</p></div><div id="html" class="card"><h2>HTML Playground</h2><textarea id="htmlCode"><h1>Hello World</h1></textarea><button onclick="runHTML()">Run</button><iframe id="htmlFrame"></iframe></div><div id="css" class="card"><h2>CSS Playground</h2><textarea id="cssCode">body{background:black;color:white}</textarea><button onclick="runCSS()">Run</button><iframe id="cssFrame"></iframe></div><div id="js" class="card"><h2>JS Playground</h2><textarea id="jsCode">document.getElementById('output').innerHTML='Hello JS';</textarea><button onclick="runJS()">Run</button><iframe id="jsFrame"></iframe></div><div id="tools" class="card"><h2>Password Generator</h2><button onclick="generatePassword()">Generate</button><p id="passwordOutput"></p><h2>UUID Generator</h2><button onclick="generateUUID()">Generate</button><p id="uuidOutput"></p></div><script>function runHTML(){htmlFrame.srcdoc=htmlCode.value}function runCSS(){cssFrame.srcdoc=`<style>${cssCode.value}</style><h1>Preview</h1>`}function runJS(){jsFrame.srcdoc=`<div id=output></div><script>${jsCode.value}<\/script>`}runHTML();runCSS();runJS();function generatePassword(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let p='';for(let i=0;i<16;i++)p+=c[Math.floor(Math.random()*c.length)];passwordOutput.innerText=p}function generateUUID(){uuidOutput.innerText=crypto.randomUUID()}</script></body></html>
